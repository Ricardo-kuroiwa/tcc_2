[tool.poetry]
packages = [{ include = "src" }]
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
taskipy = "^1.14.1"
isort = "^7.0.0"
black = "^25.12.0"

[tool.taskipy.tasks]
#Runs Medalions
bronze = "py -m src.data_transform.bronze_processor "  
silver = "py -m src.data_transform.silver_processor"
gold = "py -m src.data_transform.gold_processor"
pipeline = "task bronze && task silver && task gold"

